A static-site knowledge graph documenting cross-platform identity convergence for creative symbol / pseudonym tracking. Built as a Jekyll-like site with timeline, cross-platform correlation, metadata extraction, and Neo4j Cypher schema.

> This repo (luv931/branham-symbol-identity-graph) is the source for a GitHub Pages site that maps how a creator moves across SoundCloud, CGTrader, Sketchfab, ArtStation, and social networks into a unified Neo4j graph.

## Site Map

- \`index.html\` — Landing + graph preview
- \`/timeline/\` — Chronological appearance of handles
- \`/timeline_diagram/\` — Mermaid gantt + flowchart visualizations
- \`/cross_platform/\` — Correlation matrix across marketplaces
- \`/metadata/\` — EXIF, profile bios, linkage heuristics
- \`/identity_graph/\` — Exported nodes/edges for Neo4j
- \`schema/identity_graph.cypher\` — Canonical Cypher schema
- \`schema/timeline.cypher\` — Temporal indexing

## Identity Convergence Flow

// Owner: luv931/branham-symbol-identity-graph • commit 0a9b66b • main

CREATE CONSTRAINT profile_handle IF NOT EXISTS FOR (p:Profile) REQUIRE p.handle IS UNIQUE;
CREATE CONSTRAINT platform_name IF NOT EXISTS FOR (pl:Platform) REQUIRE pl.name IS UNIQUE;

// Nodes
MERGE (p:Profile {handle: 'branham', display: 'Branham Symbol', type: 'pseudonym'})
  SET p.first_seen = date('2018-03-12'), p.confidence = 0.94;

MERGE (sc:Platform {name: 'SoundCloud', url: 'https://soundcloud.com/branham', category: 'audio'})
MERGE (cg:Platform {name: 'CGTrader', url: 'https://cgtrader.com/branham', category: '3d_marketplace'})
MERGE (sf:Platform {name: 'Sketchfab', url: 'https://sketchfab.com/branham', category: '3d_portfolio'})
MERGE (as:Platform {name: 'ArtStation', url: 'https://artstation.com/branham', category: 'art_portfolio'})
MERGE (tw:Platform {name: 'Twitter', category: 'social'})
MERGE (ig:Platform {name: 'Instagram', category: 'social'})

// Relationships
MATCH (p:Profile {handle:'branham'}), (sc:Platform {name:'SoundCloud'})
MERGE (p)-[r:APPEARS_ON {first_seen: date('2018-03-12'), evidence: 'handle_match + bio_similarity', confidence: 0.92}]->(sc);

MATCH (p:Profile {handle:'branham'}), (cg:Platform {name:'CGTrader'})
MERGE (p)-[:APPEARS_ON {first_seen: date('2019-06-04'), confidence: 0.89}]->(cg);

MATCH (p:Profile {handle:'branham'}), (sf:Platform {name:'Sketchfab'})
MERGE (p)-[:APPEARS_ON {first_seen: date('2019-11-20'), confidence: 0.91}]->(sf);

MATCH (p:Profile {handle:'branham'}), (as:Platform {name:'ArtStation'})
MERGE (p)-[:APPEARS_ON {first_seen: date('2020-02-15'), confidence: 0.93}]->(as);

// Cross-platform linkage via shared asset hash
MATCH (a:Asset {hash: 'a1b2c3'}), (p:Profile {handle:'branham'})
MERGE (p)-[:OWNS {verified: true}]->(a);

// Timeline index
CREATE INDEX profile_first_seen IF NOT EXISTS FOR (p:Profile) ON (p.first_seen);

// Query: full convergence path
MATCH path = (p:Profile)-[r:APPEARS_ON*]->(pl:Platform)
RETURN p.handle, [n in nodes(path) | n.name] as platforms, length(path) as hops
ORDER BY hops DESC;

CREATE CONSTRAINT event_id IF NOT EXISTS FOR (e:Event) REQUIRE e.id IS UNIQUE;

MERGE (e1:Event {id: 'evt_sc_2018', platform: 'SoundCloud', date: date('2018-03-12'), type: 'profile_create'})
MERGE (e2:Event {id: 'evt_cg_2019', platform: 'CGTrader', date: date('2019-06-04'), type: 'store_open'})
MERGE (e3:Event {id: 'evt_sf_2019', platform: 'Sketchfab', date: date('2019-11-20'), type: 'portfolio_publish'})
MERGE (e4:Event {id: 'evt_as_2020', platform: 'ArtStation', date: date('2020-02-15'), type: 'art_upload'})

MATCH (e1:Event {id:'evt_sc_2018'}), (e2:Event {id:'evt_cg_2019'})
MERGE (e1)-[:NEXT {gap_days: duration.between(e1.date, e2.date).days}]->(e2);
